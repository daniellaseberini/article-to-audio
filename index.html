<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article to Audio — give your reading list a voice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2.5' y='9' width='3.2' height='6' rx='1.6' fill='%23B5502E'/%3E%3Crect x='10.4' y='3.5' width='3.2' height='17' rx='1.6' fill='%23241F1A'/%3E%3Crect x='18.3' y='9' width='3.2' height='6' rx='1.6' fill='%23B5502E'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper:        #F6F1E7;
      --paper-card:   #FFFCF6;
      --ink:          #241F1A;
      --ink-soft:     #6E6355;
      --border:       rgba(36,31,26,0.12);
      --accent:       #B5502E;
      --accent-soft:  rgba(181,80,46,0.10);
      --accent-border:rgba(181,80,46,0.30);
      --error-bg:     #F3E7DC;
      --error-border: rgba(181,80,46,0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Archivo', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }
    .page { display: flex; justify-content: center; padding: 76px 20px 60px; }
    .wrap { width: 100%; max-width: 580px; }

    /* ── HERO ── */
    .hero { text-align: center; margin-bottom: 44px; }
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 14px;
    }
    h1 {
      font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(38px, 8vw, 58px);
      letter-spacing: -1.5px; line-height: 0.98; color: var(--ink);
    }
    h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
    .tagline {
      font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
      font-size: 18px; color: var(--ink-soft); margin-top: 14px;
    }
    .waveform {
      display: flex; align-items: center; justify-content: center; gap: 3px;
      height: 30px; margin: 28px auto 0;
    }
    .waveform .bar {
      width: 3px; border-radius: 2px; background: var(--ink-soft); opacity: 0.35;
      height: 30%; animation: breathe 2.8s ease-in-out infinite;
    }
    .waveform.active .bar {
      background: var(--accent); opacity: 1; animation-name: bounce; animation-duration: 0.85s;
    }
    @keyframes breathe { 0%, 100% { height: 18%; } 50% { height: 55%; } }
    @keyframes bounce  { 0%, 100% { height: 14%; } 50% { height: 95%; } }

    /* ── TOOL CARD ── */
    .tool-card {
      background: var(--paper-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 36px 34px; box-shadow: 0 1px 2px rgba(36,31,26,0.04), 0 24px 48px rgba(36,31,26,0.05);
    }

    form { display: flex; flex-direction: column; gap: 12px; }
    input[type="url"] {
      width: 100%; padding: 15px 17px; border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 15px; font-family: 'Archivo', sans-serif; color: var(--ink);
      background: var(--paper); transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="url"]::placeholder { color: var(--ink-soft); opacity: 0.7; }
    input[type="url"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    button { font-family: 'Archivo', sans-serif; cursor: pointer; border: none; }
    .btn-primary {
      background: var(--ink); color: var(--paper-card); font-size: 15px; font-weight: 600;
      padding: 15px 20px; border-radius: 9px; transition: background 0.15s, transform 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ── PIPELINE ── */
    .pipeline { display: none; flex-direction: column; margin-top: 30px; padding-top: 4px; }
    .pipeline.anim-in { display: flex; animation: fadeInUp 0.4s ease; }
    .step { display: flex; align-items: center; gap: 14px; padding: 9px 0; position: relative; }
    .step:not(:last-child)::before {
      content: ''; position: absolute; left: 11px; top: 32px; width: 2px; height: 24px; background: var(--border);
    }
    .step-dot {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
      background: var(--paper-card); flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      position: relative; transition: border-color 0.25s, background 0.25s;
    }
    .step-dot .check { font-size: 12px; font-weight: 700; color: var(--paper-card); opacity: 0; transition: opacity 0.2s; }
    .step.active .step-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .step.active .step-dot::after {
      content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      animation: pulse 1s ease-in-out infinite;
    }
    .step.done .step-dot { background: var(--ink); border-color: var(--ink); }
    .step.done .step-dot .check { opacity: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
    .step-label { font-size: 14.5px; font-weight: 500; color: var(--ink-soft); transition: color 0.25s; }
    .step.active .step-label, .step.done .step-label { color: var(--ink); font-weight: 600; }

    /* ── ERROR ── */
    .error-card { display: none; margin-top: 26px; text-align: center; background: var(--error-bg);
      border: 1px solid var(--error-border); border-radius: 10px; padding: 24px 22px; }
    .error-card.anim-in { display: block; animation: fadeInUp 0.4s ease; }
    .error-kicker { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 19px; color: var(--accent); margin-bottom: 6px; }
    .error-text { font-size: 14px; color: var(--ink); line-height: 1.55; margin-bottom: 18px; }
    .btn-retry {
      background: none; border: 1.5px solid var(--border); color: var(--ink); font-weight: 600;
      font-size: 13.5px; padding: 10px 20px; border-radius: 8px; transition: border-color 0.15s, color 0.15s;
    }
    .btn-retry:hover { border-color: var(--accent); color: var(--accent); }

    /* ── RESULT ── */
    .result { display: none; margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--border); }
    .result.anim-in { display: block; animation: fadeInUp 0.4s ease; }
    .result-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; letter-spacing: -0.3px; color: var(--ink); margin-bottom: 6px; }
    .result-meta { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
    .char-note { font-size: 12.5px; color: var(--ink-soft); opacity: 0.85; margin-top: 4px; line-height: 1.5; }

    .player {
      display: flex; align-items: center; gap: 14px; margin: 20px 0; padding: 13px 16px;
      background: var(--paper); border: 1px solid var(--border); border-radius: 10px;
    }
    .play-btn {
      width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--paper-card);
      display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
      transition: background 0.15s, transform 0.15s;
    }
    .play-btn:hover { background: var(--accent); transform: scale(1.06); }
    .player-track { flex: 1; height: 6px; background: var(--border); border-radius: 4px; position: relative; cursor: pointer; }
    .player-progress { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); border-radius: 4px; }
    .player-time { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }

    .btn-download {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      background: var(--ink); color: var(--paper-card); text-decoration: none; font-weight: 600;
      font-size: 14.5px; padding: 15px; border-radius: 9px; transition: background 0.15s, transform 0.15s;
    }
    .btn-download:hover { background: var(--accent); transform: translateY(-1px); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      .page { padding: 52px 14px 40px; }
      .tool-card { padding: 26px 20px; }
      .hero { margin-bottom: 34px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="hero">
        <div class="eyebrow">Text → Voice</div>
        <h1>Article <em>to</em> Audio</h1>
        <p class="tagline">Give your reading list a voice.</p>
        <div class="waveform" id="hero-waveform" aria-hidden="true"></div>
      </div>

      <div class="tool-card">
        <form id="form">
          <input type="url" id="url-input" placeholder="Paste an article link…" required />
          <button type="submit" class="btn-primary" id="submit-btn">Convert to Audio</button>
        </form>

        <div class="pipeline" id="pipeline">
          <div class="step" data-step="fetch">
            <span class="step-dot"><span class="check">✓</span></span>
            <span class="step-label">Fetching article</span>
          </div>
          <div class="step" data-step="extract">
            <span class="step-dot"><span class="check">✓</span></span>
            <span class="step-label">Extracting text</span>
          </div>
          <div class="step" data-step="voice">
            <span class="step-dot"><span class="check">✓</span></span>
            <span class="step-label">Generating voice</span>
          </div>
        </div>

        <div class="error-card" id="error-card">
          <div class="error-kicker">Hmm.</div>
          <div class="error-text" id="error-text"></div>
          <button type="button" class="btn-retry" id="retry-btn">Try again</button>
        </div>

        <div class="result" id="result">
          <div class="result-title" id="result-title"></div>
          <div class="result-meta" id="result-meta"></div>
          <div class="char-note" id="char-note"></div>
          <div class="player">
            <button type="button" class="play-btn" id="play-btn">▶</button>
            <div class="player-track" id="player-track">
              <div class="player-progress" id="player-progress"></div>
            </div>
            <div class="player-time" id="player-time">0:00 / 0:00</div>
          </div>
          <a class="btn-download" id="download-link" download="article.mp3">⬇ Download MP3</a>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-el" style="display:none"></audio>

  <script>
    const form = document.getElementById('form');
    const urlInput = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const pipeline = document.getElementById('pipeline');
    const errorCard = document.getElementById('error-card');
    const errorText = document.getElementById('error-text');
    const retryBtn = document.getElementById('retry-btn');
    const result = document.getElementById('result');
    const heroWaveform = document.getElementById('hero-waveform');
    const audioEl = document.getElementById('audio-el');
    const playBtn = document.getElementById('play-btn');
    const playerTrack = document.getElementById('player-track');
    const playerProgress = document.getElementById('player-progress');
    const playerTime = document.getElementById('player-time');
    const downloadLink = document.getElementById('download-link');

    // Build equalizer bars with organic per-bar timing
    const BAR_COUNT = 26;
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('span');
      bar.className = 'bar';
      bar.style.animationDelay = (Math.random() * 1.2).toFixed(2) + 's';
      heroWaveform.appendChild(bar);
    }

    function showSection(el) {
      el.classList.remove('anim-in');
      void el.offsetWidth;
      el.classList.add('anim-in');
    }
    function hideSection(el) { el.classList.remove('anim-in'); }

    function setStep(name, state) {
      const el = pipeline.querySelector(`[data-step="${name}"]`);
      el.classList.remove('active', 'done');
      if (state) el.classList.add(state);
    }
    function resetSteps() {
      ['fetch', 'extract', 'voice'].forEach(s => setStep(s, null));
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    let stepTimers = [];
    function clearStepTimers() { stepTimers.forEach(clearTimeout); stepTimers = []; }

    async function runConversion(url) {
      hideSection(errorCard);
      hideSection(result);
      resetSteps();
      showSection(pipeline);
      heroWaveform.classList.remove('active');
      submitBtn.disabled = true;

      setStep('fetch', 'active');
      stepTimers.push(setTimeout(() => { setStep('fetch', 'done'); setStep('extract', 'active'); }, 700));
      stepTimers.push(setTimeout(() => {
        setStep('extract', 'done'); setStep('voice', 'active');
        heroWaveform.classList.add('active');
      }, 1900));

      let res, data;
      try {
        res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        data = await res.json();
      } catch (err) {
        clearStepTimers();
        hideSection(pipeline);
        heroWaveform.classList.remove('active');
        submitBtn.disabled = false;
        errorText.textContent = "Couldn't reach the server. Is it running?";
        showSection(errorCard);
        return;
      }

      clearStepTimers();
      // Cascade any not-yet-done steps to completion so the pipeline never looks stuck
      for (const s of ['fetch', 'extract', 'voice']) {
        setStep(s, 'done');
        await new Promise(r => setTimeout(r, 90));
      }
      await new Promise(r => setTimeout(r, 250));

      hideSection(pipeline);
      heroWaveform.classList.remove('active');
      submitBtn.disabled = false;

      if (!res.ok) {
        errorText.textContent = data.error || 'Something went wrong. Please try again.';
        showSection(errorCard);
        return;
      }

      renderResult(data);
      showSection(result);
    }

    function slugify(title) {
      return (title || 'article').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 60) || 'article';
    }

    function renderResult(data) {
      const byteChars = atob(data.audioBase64);
      const bytes = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'audio/mpeg' });
      const objectUrl = URL.createObjectURL(blob);

      audioEl.src = objectUrl;
      downloadLink.href = objectUrl;
      downloadLink.download = slugify(data.title) + '.mp3';
      document.getElementById('result-title').textContent = data.title;

      const words = data.usedCharCount / 5.5;
      const readMin = Math.max(1, Math.round(words / 200));
      const metaEl = document.getElementById('result-meta');
      metaEl.textContent = `${readMin} min read · … listen`;
      audioEl.onloadedmetadata = () => {
        metaEl.textContent = `${readMin} min read · ${formatTime(audioEl.duration)} listen`;
        playerTime.textContent = `0:00 / ${formatTime(audioEl.duration)}`;
      };

      const noteEl = document.getElementById('char-note');
      noteEl.textContent = data.truncated
        ? `Article: ${data.fullCharCount.toLocaleString()} characters — converting the first ${data.usedCharCount.toLocaleString()} to save API credits`
        : `Article: ${data.fullCharCount.toLocaleString()} characters — converting all of it`;

      playBtn.textContent = '▶';
    }

    // Custom player controls
    playBtn.addEventListener('click', () => {
      if (audioEl.paused) { audioEl.play(); playBtn.textContent = '❚❚'; }
      else { audioEl.pause(); playBtn.textContent = '▶'; }
    });
    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.duration) return;
      playerProgress.style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
      playerTime.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
    });
    audioEl.addEventListener('ended', () => { playBtn.textContent = '▶'; });
    playerTrack.addEventListener('click', (e) => {
      if (!audioEl.duration) return;
      const rect = playerTrack.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      audioEl.currentTime = ratio * audioEl.duration;
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      runConversion(urlInput.value.trim());
    });
    retryBtn.addEventListener('click', () => {
      if (urlInput.value.trim()) runConversion(urlInput.value.trim());
    });
  </script>
</body>
</html>
